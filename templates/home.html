<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>برّاق API</title><style>body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#071527;color:#eef5ff;min-height:100vh;display:grid;place-items:center}.card{width:min(760px,90vw);background:linear-gradient(145deg,#102844,#0b1d33);border:1px solid #284d72;border-radius:28px;padding:44px;box-shadow:0 28px 90px #0008}.gems{font-size:42px;letter-spacing:8px}h1{font-size:42px;margin:18px 0 8px;color:#fff}p{line-height:1.9;color:#c7d7e8}.links{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}.links a{color:#071527;background:#f5c85c;text-decoration:none;padding:12px 18px;border-radius:14px;font-weight:700}.links a.secondary{background:#1d3f60;color:#eaf4ff}.meta{margin-top:26px;font-size:13px;color:#8eabc6}</style></head><body><main class="card"><div class="gems">◆ ◆ ◆ ◆ ◆</div><h1>{{ app_name }}</h1><p>الخدمة الخلفية الرسمية لمنصة برّاق التعليمية. استخدم واجهات API الموثقة لتطبيق الجوال ولوحة التحكم وخدمة الذكاء الاصطناعي.</p><div class="links"><a href="{{ docs_url }}">توثيق API</a><a class="secondary" href="{{ api_root }}">جذر API</a><a class="secondary" href="{{ health_url }}">حالة الخدمة</a></div><div class="meta">الإصدار {{ version }}</div></main></body></html>
